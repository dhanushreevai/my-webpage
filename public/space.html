  <!-- ═══════════════════════════════════════════════════════════
       FadingVideo — rAF-driven crossfade, no CSS transitions
  ════════════════════════════════════════════════════════════════ -->
  <script type="text/babel">
  (function () {
    const { useRef, useEffect, useCallback } = React;

    const FADE_MS      = 500;
    const FADE_OUT_LEAD = 0.55;

    function FadingVideo({ src, className, style }) {
      const videoRef     = useRef(null);
      const rafRef       = useRef(null);
      const fadingOutRef = useRef(false);

      const fadeTo = useCallback((target, duration) => {
        if (rafRef.current) cancelAnimationFrame(rafRef.current);
        const video = videoRef.current;
        if (!video) return;

        const t0           = performance.now();
        const startOpacity = parseFloat(video.style.opacity) || 0;

        const step = (now) => {
          const progress = Math.min((now - t0) / duration, 1);
          video.style.opacity = startOpacity + (target - startOpacity) * progress;
          if (progress < 1) {
            rafRef.current = requestAnimationFrame(step);
          } else {
            rafRef.current = null;
          }
        };

        rafRef.current = requestAnimationFrame(step);
      }, []);

      useEffect(() => {
        const video = videoRef.current;
        if (!video) return;

        const onLoadedData = () => {
          video.style.opacity = 0;
          video.play().catch(() => {});
          fadeTo(1, FADE_MS);
        };

        const onTimeUpdate = () => {
          const remaining = video.duration - video.currentTime;
          if (!fadingOutRef.current && remaining <= FADE_OUT_LEAD && remaining > 0) {
            fadingOutRef.current = true;
            fadeTo(0, FADE_MS);
          }
        };

        const onEnded = () => {
          video.style.opacity = 0;
          setTimeout(() => {
            video.currentTime  = 0;
            fadingOutRef.current = false;
            video.play().catch(() => {});
            fadeTo(1, FADE_MS);
          }, 100);
        };

        video.addEventListener('loadeddata', onLoadedData);
        video.addEventListener('timeupdate', onTimeUpdate);
        video.addEventListener('ended',      onEnded);

        return () => {
          if (rafRef.current) cancelAnimationFrame(rafRef.current);
          video.removeEventListener('loadeddata', onLoadedData);
          video.removeEventListener('timeupdate', onTimeUpdate);
          video.removeEventListener('ended',      onEnded);
        };
      }, [fadeTo]);

      return (
        <video
          ref={videoRef}
          src={src}
          autoPlay
          muted
          playsInline
          preload="auto"
          className={className}
          style={{ ...style, opacity: 0 }}
        />
      );
    }

    window.FadingVideo = FadingVideo;
  })();
  </script>

  <!-- ═══════════════════════════════════════════════════════════
       BlurText — word-by-word blur-in via IntersectionObserver
  ════════════════════════════════════════════════════════════════ -->
  <script type="text/babel">
  (function () {
    const { useRef, useEffect, useState } = React;
    const { motion } = Motion;

    function BlurText({ text, className }) {
      const ref        = useRef(null);
      const [visible, setVisible] = useState(false);

      useEffect(() => {
        const obs = new IntersectionObserver(
          ([e]) => { if (e.isIntersecting) setVisible(true); },
          { threshold: 0.1 }
        );
        if (ref.current) obs.observe(ref.current);
        return () => obs.disconnect();
      }, []);

      return (
        <p
          ref={ref}
          className={className}
          style={{ display: 'flex', flexWrap: 'wrap', justifyContent: 'center', rowGap: '0.1em' }}
        >
          {text.split(' ').map((word, i) => (
            <motion.span
              key={i}
              initial={{ filter: 'blur(10px)', opacity: 0, y: 50 }}
              animate={visible ? {
                filter: ['blur(10px)', 'blur(5px)', 'blur(0px)'],
                opacity: [0, 0.5, 1],
                y: [50, -5, 0],
              } : {}}
              transition={{ duration: 0.7, times: [0, 0.5, 1], ease: 'easeOut', delay: i * 0.1 }}
              style={{ display: 'inline-block', marginRight: '0.28em' }}
            >
              {word}
            </motion.span>
          ))}
        </p>
      );
    }

    window.BlurText = BlurText;
  })();
  </script>

  <script type="text/babel">
  (function () {

    const _err = console.error;
    console.error = (...a) => {
      if (typeof a[0] === 'string' && a[0].includes('Each child in a list')) return;
      _err.apply(console, a);
    };

        <React.Fragment>
          <HeroSection />
          <CapabilitiesSection />
        </React.Fragment>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  })();
